[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-content-md"
version = "0.2.0"
description = "Extract resumable creator video transcripts into one cumulative Markdown file."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "creator-md contributors" }]
keywords = ["tiktok", "transcription", "markdown", "whisper", "yt-dlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
creator-md = "creator_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
