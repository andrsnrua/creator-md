[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-skill"
version = "0.1.0"
description = "Turn public creator video libraries into portable, validated Agent Skills."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "creator-skill contributors" }]
keywords = ["agent-skills", "tiktok", "openkb", "codex", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
creator-skill = "creator_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

