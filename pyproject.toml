[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-content-md"
version = "0.4.0"
description = "Maintain creator libraries by area, collect source evidence, and build reusable skills."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "creator-md contributors" }]
keywords = ["tiktok", "transcription", "markdown", "whisper", "yt-dlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "av>=14,<17",
  "yt-dlp[default,curl-cffi]",
  "faster-whisper>=1.2,<2",
  "gallery-dl>=1.32.14,<1.33",
  "rapidocr-onnxruntime>=1.4.4,<1.5",
  "keyring>=25",
]

[project.optional-dependencies]
legacy = ["martino-summarize", "openai-whisper"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
creator-md = "creator_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
creator_skill = ["static/*.html", "static/*.css", "static/*.js", "skill_resources/*.md", "skill_resources/ads/*", "skill_resources/ads/**/*"]

[tool.setuptools.exclude-package-data]
creator_skill = ["skill_resources/**/__pycache__/*", "skill_resources/**/*.pyc", "skill_resources/**/*.tmp", "skill_resources/**/*.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
